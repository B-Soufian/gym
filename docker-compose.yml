version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: gymvision_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymvision
      POSTGRES_USER: gymvision_app
      POSTGRES_PASSWORD: gymvision_secret_2025
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymvision_app -d gymvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymvision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
